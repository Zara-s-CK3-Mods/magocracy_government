 building_type_magocracy_valyrian_roads_01: "Blackstone Roads"
 building_type_magocracy_valyrian_roads_01_desc: "The Blackstone roads of the Freehold are a famous example of its fused stone method of construction. They are almost unmatched in durability, and some suggest they serve an occult purpose."
 magocracy_valyrian_roads_01: "Blackstone Roads"
 magocracy_valyrian_roads_02: "Blackstone Roads II"
 building_type_magocracy_valyrian_walls_01: "Blackstone Walls"
 building_type_magocracy_valyrian_walls_01_desc: "Walls of fused blackstone, raised by sorcery in the manner of the Freehold, and all but impervious to the mortal arts of war."
