 great_project_type_magocracy_construct_valyrian_spires_project: "Construct Valyrian Spires"
 great_project_type_magocracy_construct_valyrian_spires_project_desc: "An imposing structure of fused black stone with a jagged top. Such spires once dotted the Freehold as reminders of the power of its sorcerers, and the first raised here founds a [GetDistrictType('magocracy_valyrian_district').GetName|V]. Each later spire raises the district higher."
 great_project_type_magocracy_construct_valyrian_spires_project_possessive: "Valyrian Spires'"
 great_project_type_magocracy_construct_valyrian_spires_project_province_gains: "The [province|E] founds a [GetDistrictType('magocracy_valyrian_district').GetName|V], or raises its Valyrian Spires a level"
 great_project_type_magocracy_construct_valyrian_spires_project_contribution_base_materials: "Construction Materials"
 great_project_type_magocracy_construct_valyrian_spires_project_contribution_magical_material: "Magical Materials"
 great_project_type_magocracy_construct_valyrian_spires_project_contribution_work_force: "Workforce"

 great_project_type_magocracy_construct_mages_spire_project: "Construct Mage's Tower"
 great_project_type_magocracy_construct_mages_spire_project_desc: "A mighty tower that rises towards the sky. Our magical might is shown in its many rows of books and the crackling wards that glow purple in the setting sun. It must stand in the [GetDistrictType('magocracy_valyrian_district').GetName|V] of a [duchy|E] capital."
 great_project_type_magocracy_construct_mages_spire_project_possessive: "Mage's Tower's"
 great_project_type_magocracy_construct_mages_spire_project_province_gains: "The [GetDistrictType('magocracy_valyrian_district').GetName|V] gains the [GetBuildingType('zz_mages_tower_tower_01').GetName|V] [building|E]"
 great_project_type_magocracy_construct_mages_spire_project_contribution_base_materials: "Construction Materials"
 great_project_type_magocracy_construct_mages_spire_project_contribution_magical_material: "Magical Materials"
 great_project_type_magocracy_construct_mages_spire_project_contribution_work_force: "Workforce"
 great_project_type_magocracy_construct_mages_spire_project_contribution_acolytes: "Acolytes"

 great_project_type_magocracy_construct_valyrian_roads_project: "Construct Blackstone Roads"
 great_project_type_magocracy_construct_valyrian_roads_project_desc: "A network of fused blackstone snaking out from the [GetDistrictType('magocracy_valyrian_district').GetName|V], drinking up the light of the sun in a lattice of patterns. Beyond carrying trade, some say the roads serve an occult purpose."
 great_project_type_magocracy_construct_valyrian_roads_project_possessive: "Blackstone Roads'"
 great_project_type_magocracy_construct_valyrian_roads_project_province_gains: "The [GetDistrictType('magocracy_valyrian_district').GetName|V] gains or improves its Blackstone Roads"
 great_project_type_magocracy_construct_valyrian_roads_project_contribution_base_materials: "Construction Materials"
 great_project_type_magocracy_construct_valyrian_roads_project_contribution_magical_material: "Magical Materials"
 great_project_type_magocracy_construct_valyrian_roads_project_contribution_work_force: "Workforce"

 great_project_type_magocracy_construct_valyrian_walls_project: "Construct Blackstone Walls"
 great_project_type_magocracy_construct_valyrian_walls_project_desc: "A bulwark of fused blackstone carved by sorcery, promising to make the [GetDistrictType('magocracy_valyrian_district').GetName|V] all but impervious to weapons of mortal make."
 great_project_type_magocracy_construct_valyrian_walls_project_possessive: "Blackstone Walls'"
 great_project_type_magocracy_construct_valyrian_walls_project_province_gains: "The [GetDistrictType('magocracy_valyrian_district').GetName|V] gains Blackstone Walls"
