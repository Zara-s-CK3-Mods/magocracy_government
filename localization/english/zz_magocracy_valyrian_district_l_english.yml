 # Valyrian District
 magocracy_valyrian_district: "Valyrian District"
 magocracy_valyrian_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$@government_type_republic!Magocracy\n$BULLET_WITH_TAB$[drops_of_power|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[civic_tax_i][civic_tax_short|E]"
 magocracy_valyrian_district_desc_flavor: "A quarter of fused black stone and soaring spires, raised by sorcery in the image of the lost Freehold."
 building_type_magocracy_valyrian_spires_01: "Valyrian Spires"
 building_type_magocracy_valyrian_spires_01_desc: "The towers of Valyria reflect the design paradigms of a world of sorcery. These dominating towers of fused black stone are centres of commerce and administration, and every new spire raised makes room for more."
