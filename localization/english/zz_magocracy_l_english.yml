 magocracy_type_pass_phrase:0 "[Law.GetNameNoTooltip]"
 magocracy_type_confirmation_button_text:0 "Change Magocracy Administration"
 magocracy_type_warmage:0 "Warmage Magocracy"
 magocracy_type_warmage_effects:0 "\n#weak A realm held by battle-magisters, where sorcery is first of all a weapon of war and the legions march beneath the spells of their lords.#!"
 magocracy_type_arcane:0 "Arcane Magocracy"
 magocracy_type_arcane_effects:0 "\n#weak By the might of magic and the twisted mysteries of sorcerous ritual is the realm upheld. A true magocracy, where magical power is valued above all else.#!"
 magocracy_type_merchant:0 "Merchant-Mage Magocracy"
 magocracy_type_merchant_effects:0 "\n#weak A realm of merchant-magisters, whose spells fill coffers as readily as they fell armies, and whose wealth buys renown at home and abroad.#!"

