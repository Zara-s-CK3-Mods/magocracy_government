l_english:
 mages_commune_events_2.1.a: "My [maa_flavor.GetNameNoTooltip|l] need a proper place to muster."
 mages_commune_events_2.1.b: "Pastures provide well-fed horses for the [maa_flavor.GetNameNoTooltip|l]."
 mages_commune_events_2.1.c: "A watchtower will surely improve my [maa_flavor.GetNameNoTooltip|l]."
 mages_commune_events_2.1.d: "Hire all the laborers you can find — there is much to do!"
 mages_commune_events_2.1.desc: "As the whispers of rebellion echo throughout the grounds of my Mage's Commune, the stark reality of my impending confrontation with the emperor casts a shadow over our preparations. The tangible strength of the [Mage's Commune.GetNamePossessive] defenses and resources is paramount.\n\nMy [ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] presents me with plans for key ways to bolster the base of my power. "Now is the time to fortify the Mage's Commune," [interlocutor.GetSheHe] urges, pointing out the proposed locations for construction."
 mages_commune_events_2.1.t: "$grand_ambitions_header$: Fortified Foundations"
 mages_commune_events_2.2.a: "We must invite [other_family.GetHerHim] immediately!"
 mages_commune_events_2.2.a.lose: "The visit was a disaster"
 mages_commune_events_2.2.a.win: "The visit goes well"
 mages_commune_events_2.2.b: "We must work to make these lands ours."
 mages_commune_events_2.2.b.lose: "Your plot is exposed"
 mages_commune_events_2.2.b.win: "Your influence spreads"
 mages_commune_events_2.2.c: "I must simply keep my head down."
 mages_commune_events_2.2.desc: "Since [location.GetName] fell into the possession of House [other_family.GetHouse.GetName], I have begun to feel like a guest in my own Mage's Commune. Of course the lands within the home are mine, but everything beyond the gates belongs to [other_family.GetName].\n\nAs I go for my morning walk around the grounds, I can't help but wonder if it would be politically advantageous to have [other_family.GetFirstNameNoTooltip] walking by my side..."
 mages_commune_events_2.2.t: "Cordially"
 mages_commune_events_2.3.a: "Hit their finances."
 mages_commune_events_2.3.a.lose: "You are caught"
 mages_commune_events_2.3.a.win: "You extract their wealth"
 mages_commune_events_2.3.b: "Bribe their servants."
 mages_commune_events_2.3.c: "I must tolerate their presence for now."
 mages_commune_events_2.3.desc: "I take a leisurely stroll through [location.GetNameNoTier] with my usual entourage of confidants and protectors and marvel at the magnificent buildings therein. I am drunk in delight for the lands I govern, but then my mood is soured as I behold a grotesque holding of the [other_family.GetHouse.GetName] family.\n\nTheir properties are like a scattering of warts across my otherwise perfect lands, and I feel my blood begin to race at the thought of abiding their presence any longer."
 mages_commune_events_2.3.t: "A Villainous Villa"
 mages_commune_events_2.4.a: ""Continue going there, and tell me everything.""
 mages_commune_events_2.4.a.lose: "[child.GetFirstNameNoTooltip|U] is caught"
 mages_commune_events_2.4.a.win: "[child.GetFirstNameNoTooltip|U] becomes your informant"
 mages_commune_events_2.4.b: ""Try to end this foolish rivalry of ours.""
 mages_commune_events_2.4.b.crit_win: "[child.GetFirstNameNoTooltip|U] ends the rivalry"
 mages_commune_events_2.4.b.lose: "[child.GetFirstNameNoTooltip|U] fails"
 mages_commune_events_2.4.b.win: "[child.GetFirstNameNoTooltip|U] makes progress"
 mages_commune_events_2.4.c: ""Get out of my sight.""
 mages_commune_events_2.4.desc: "My guards throw a trembling [child.GetName] at my feet. [child.GetHerHis|U] face is a picture of shame, and I cannot begin to imagine what [child.GetSheHe] has done.\n\n"We found this [child.Custom2('InsultNoun', ROOT.Char)] making [child.GetHerselfHimself] familiar at the [other_family.GetHouse.GetName] Mage's Commune. You needn't wonder where [child.GetHerHis] real loyalties lie."\n\nThe thought of my own kin fraternizing with my enemies is repulsive, but perhaps [child.GetHerHis] connection may be put to use."
 mages_commune_events_2.4.t: "Folly"
 mages_commune_events_2.5.a: ""What are you doing in my Mage's Commune...? Spies!""
 mages_commune_events_2.5.b: ""We must require some contributions...""
 mages_commune_events_2.5.c: ""Make sure #EMP everyone#! knows.""
 mages_commune_events_2.5.d: ""Perhaps you'd like to stay?""
 mages_commune_events_2.5.desc: ""What a sight! It is said that there are two hundred rooms inside and all their doors are made of solid gold! And in the basement — ah! Greetings, [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\nA [local.GetWomanMan] as plain as could be stops in the middle of my garden. A small child is hiding behind [local.GetHerHis] clothes.\n\n"We were just merely having a tour of the Mage's Commune, as the locals are marveled by its magnificence!""
 mages_commune_events_2.5.t: "In Good Mage's Commune"
 mages_commune_events_2.6.a: ""A marketplace is the heart of every city.""
 mages_commune_events_2.6.b: ""I can imagine myself resting in those gardens...""
 mages_commune_events_2.6.c: ""Security is the most important measure.""
 mages_commune_events_2.6.d: ""Artisans! How I love them!""
 mages_commune_events_2.6.desc.barracks: "barracks"
 mages_commune_events_2.6.desc.garden: "garden"
 mages_commune_events_2.6.desc.guardhouse: "guardhouse"
 mages_commune_events_2.6.desc.intro: "The sound of a bag of coins is one that is difficult to mistake. [steward.GetTitledFirstName] opens the door, [steward.Custom('quirk_pos_pp')].\n\n"My liege! What a resplendent Mage's Commune this is! The servants have been marveling at the"
 mages_commune_events_2.6.desc.market: "market"
 mages_commune_events_2.6.desc.olive: "olive grove"
 mages_commune_events_2.6.desc.outro: "since the morn," [steward.GetFirstNameNoTooltip] gestures vaguely in its direction.\n\n"It would be my great pleasure to assist you in ensuring we get the full benefit out of it.""
 mages_commune_events_2.6.desc.tea: "tea plantation"
 mages_commune_events_2.6.desc.vineyard: "vineyard"
 mages_commune_events_2.6.desc.workshop: "workshop"
 mages_commune_events_2.6.e: ""My men shall receive the best training.""
 mages_commune_events_2.6.f: ""I can't wait to taste that wine!""
 mages_commune_events_2.6.g: ""Oil is the most basic ingredient.""
 mages_commune_events_2.6.h: ""We need #EMP every#! coin in order to keep it that way.""
 mages_commune_events_2.6.h.flavor: "That gold would me much safer with me..."
 mages_commune_events_2.6.t: "For a Bit of Gold..."
 mages_commune_events_2.7.a: "We should ask for hospitality."
 mages_commune_events_2.7.a.tt: "We shall see what kind of reaction we shall receive."
 mages_commune_events_2.7.b: "No time to waste here."
 mages_commune_events_2.7.desc: "Dusk surprises us as we make our way through the [location.Custom('GetTerrainTypePlural')] around [location.GetName], still a fair distance from the closest settlement.\n\nThe only sign of human presence we see for miles is the intimidating outer wall of what seems to be some sort of private Mage's Commune."
 mages_commune_events_2.7.desc_capital: "Dusk surprises us still a fair distance from the safe walls of [location.GetName].\n\nThe outbuildings of a luxurious Mage's Commune come into sight. How relaxing it would be to spend the night here, away from the dusty road and before immersing ourselves into the clamor of a great capital!"
 mages_commune_events_2.7.desc_fellow: "\n\nIf my memory doesn't betray me, these lands should belong to [event_host.GetTitledFirstName]. [event_host.GetSheHe|U] is bound to show us some kindness!"
 mages_commune_events_2.7.desc_foreigner: "\n\nUnfortunately, I'm not familiar with the lord or lady of this land. Hopefully they won't deny some poor pilgrims a warm meal and a humble bed!"
 mages_commune_events_2.7.t: "A Warm Meal?"
 mages_commune_events_2.8.a: "You shall receive an exemplary punishment!"
 mages_commune_events_2.8.b: "I #EMP could#! look the other way..."
 mages_commune_events_2.8.c: "You really shouldn't do that."
 mages_commune_events_2.8.desc: "The granaries of the [Glossary( 'dynatoi', 'DYNATOI_GLOSS')] are always full, says the wistful farmer.\n\nIn some cases, this is truer than ever; on this day, I have officially summoned [landowner.GetTitledFirstName], landowner in [capital.GetName], concerning the management of [landowner.GetHerHis] Mage's Commune. According to my sources, [landowner.GetFirstNameNoTooltip] has been buying massive amounts of grain cheaply and hoarding it in [landowner.GetHerHis] granaries, in order to resell it at a higher price in times of shortages.\n\nThis practice is forbidden by the Empire, as it cripples the income of smallholders."
 mages_commune_events_2.8.t: "The Granaries of the Powerful"
 mages_commune_events_2.9.a: "Keeping the roads safe is #EMP so#! expensive these days."
 mages_commune_events_2.9.b: "The great lengths I go to ought to be rewarded."
 mages_commune_events_2.9.c: "My grace in this matter could use some airing."
 mages_commune_events_2.9.d: "I couldn't damage such a beautiful Mage's Commune."
 mages_commune_events_2.9.desc: "Among the many smallholdings, villages, and towns of my [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], the [estate_owner.GetHouse.GetBaseName] family Mage's Commune stands as something of an outlier.\n\n[estate_owner.GetTitledFirstNamePossessive] nominally private property enjoys my protection as [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTier], and [estate_owner.GetHerHis] entitled indifference to my largesse may quickly turn to gratitude if the prospect of its withdrawal is deftly dangled..."
 mages_commune_events_2.9.reason: "Acceptance partly based on [estate_owner.GetFirstNamePossessive] personality"
 mages_commune_events_2.9.success: "[estate_owner.GetSheHe|U] catches your drift"
 mages_commune_events_2.9.t: "Provincial Leverage"
 mages_commune_events_2.10.a: "Sounds like #EMP profit#! to be collected."
 mages_commune_events_2.10.agriculture: "The agricultural improvement of my land has inspired the small-holders, whose efforts have been a great boon to the wider locality."
 mages_commune_events_2.10.b: "Local development should be encouraged."
 mages_commune_events_2.10.c: "A benign happenstance, for once."
 mages_commune_events_2.10.commerce: "The commercial opportunities have brought many merchants, whose presence has been a great boon to the wider locality."
 mages_commune_events_2.10.desc: "My family and I have long argued, somewhat spuriously, to any complaining locals and officials, that the development of the [ROOT.Char.GetHouse.GetBaseName] Mage's Commune in [Mage's Commune.GetLocation.GetBaronyNameExplicitlyNoTooltip] is to the benefit of all [Mage's Commune.GetLocation.GetTitle.GetDeJureLiege.GetNameNoTier], if not the entire [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]!\n\nBy what strange stroke of fortune I cannot say — it is actually true!"
 mages_commune_events_2.10.fallback: "The expansion of the Mage's Commune has attracted all manner of artisans, whose presence has been a great boon to the wider locality."
 mages_commune_events_2.10.martial: "The presence of my guards has warded off the usual banditry, whose absence has been a great boon to the wider locality."
 mages_commune_events_2.10.t: "Unintended Grace"
 mages_commune_events_2.11.a: "I suppose my [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] could use more attention."
 mages_commune_events_2.11.b: "Oh please, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] practically runs itself!"
 mages_commune_events_2.11.c: "Perhaps #EMP you#! should pick up the slack, [complainant.GetTitleAsNameNoTooltip]."
 mages_commune_events_2.11.d: "Are you #EMP suggesting#! I am too incompetent to manage both?"
 mages_commune_events_2.11.d.failure: "You are too incompetent to manage both"
 mages_commune_events_2.11.d.success: "You manage to stay across it all"
 mages_commune_events_2.11.desc: "My [ROOT.Char.Custom2('RelationToMeShort', complainant)], [complainant.GetFirstName], [complainant.GetTitleAsNameNoTooltip|l] of the [complainant.GetPrimaryTitle.GetTierAsNameNoTooltip|l] of [complainant.GetPrimaryTitle.GetNameNoTier], has arrived in [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] with an 'urgent' issue.\n\n"My [complainant.Custom2('RelationToMeShort', ROOT.Char)], I know you must look to your own affairs as well as those of [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip], but I fear the [ROOT.Char.GetHouse.GetBaseNameNoTooltip] Mage's Commune draws too much of your attention — and funds — from the [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]..."\n\n"There is enough to do, managing the affairs of your province, without the added distraction of your Mage's Commune.""
 mages_commune_events_2.11.t: "Dynastic Distractions"
